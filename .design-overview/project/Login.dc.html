<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'Mukta', system-ui, sans-serif; color: #1b2340; }
a { color: #1b2340; } a:hover { color: #10162b; }
</style>
</helmet>

<div style="width: 480px; min-height: 700px; background: #fbf7f0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 40px">

  <!-- Logo -->
  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 40px">
    <div style="width: 40px; height: 40px; border-radius: 10px; background: #1b2340; display: flex; align-items: center; justify-content: center">
      <span style="color: white; font-weight: 700; font-size: 20px; font-family: 'Baloo 2', sans-serif">A</span>
    </div>
    <span style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 24px; color: #1b2340">ApnaCatalog</span>
  </div>

  <!-- Card -->
  <div style="width: 100%; max-width: 380px; background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 32px; box-sizing: border-box">
    <h1 style="margin: 0 0 4px; font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 700; text-align: center; color: #1b2340">Welcome back</h1>
    <p style="margin: 0 0 28px; text-align: center; font-size: 15px; color: #64748b">Sign in to manage your catalog</p>

    <!-- Google button -->
    <button style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-family: 'Mukta', sans-serif; font-size: 15px; font-weight: 600; color: #1b2340">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 001 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- Divider -->
    <div style="display: flex; align-items: center; gap: 12px; margin: 24px 0">
      <div style="flex: 1; height: 1px; background: #e2e8f0"></div>
      <span style="font-size: 13px; color: #94a3b8; font-weight: 500">or</span>
      <div style="flex: 1; height: 1px; background: #e2e8f0"></div>
    </div>

    <!-- Email field -->
    <div style="margin-bottom: 16px">
      <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: #334155">Email</label>
      <input type="email" placeholder="you@example.com" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; font-family: 'Mukta', sans-serif; outline: none; box-sizing: border-box">
    </div>

    <!-- Submit -->
    <button style="width: 100%; padding: 12px; background: #1b2340; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; font-family: 'Mukta', sans-serif">Send magic link</button>

    <p style="margin: 20px 0 0; text-align: center; font-size: 13px; color: #94a3b8">
      No account? We&#39;ll create one for you.
    </p>
  </div>

  <!-- Footer -->
  <p style="margin-top: 32px; font-size: 13px; color: #94a3b8">
    <a href="#" style="color: #64748b; text-decoration: none">Privacy</a>
    <span style="margin: 0 8px">&middot;</span>
    <a href="#" style="color: #64748b; text-decoration: none">Terms</a>
  </p>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
